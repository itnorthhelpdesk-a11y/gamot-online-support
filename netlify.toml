# Netlify: index.html, letterhead-assets.js at assets/ LANG ang ipa-publish sa website.
# Ang sql/, CLAUDE.md at iba pang file sa repo ay para sa developers lang
# at hindi na makikita sa live site (anumang capitalization ng URL).
# Kapag nagdagdag ng bagong file na kailangan sa website (hal. larawan),
# ilagay ito sa assets/ o idagdag sa `cp` command sa ibaba.
[build]
  publish = "dist"
  command = "rm -rf dist && mkdir dist && cp index.html letterhead-assets.js dist/ && cp -r assets dist/"
